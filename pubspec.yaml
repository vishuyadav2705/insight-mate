name: insight_mate
description: An AI-integrated productivity and multimedia assistant built with Flutter.
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.0.5
  http: ^1.2.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  intl: ^0.19.0

  # AI / Media
  flutter_tts: ^4.0.2
  speech_to_text: ^6.6.2
  mobile_scanner: ^5.2.3
  camera: ^0.11.0+2
  path_provider: ^2.1.4
  flutter_dotenv: ^5.1.0

  # Auth
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/


